version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: delly-gold:latest
    container_name: delly-gold
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:3000"
    volumes:
      - delly-gold-db:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/delly-gold.db
      - JWT_SECRET=${JWT_SECRET:-delly-gold-change-this-secret-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/products"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  delly-gold-db:
    driver: local
